    <!-- "Projects" dropdown: standard disclosure pattern. Tabbing to the
         trigger does NOT open it by itself -- only an explicit activation
         (click, or Enter on the focused link) toggles the .open class,
         which is the single source of truth for visibility. This matters:
         an earlier version also opened on :focus-within, which meant
         Escape's "close and return focus to the trigger" put focus right
         back on the one element that reopened it, so Escape silently did
         nothing whenever focus was on a menu item rather than the trigger
         itself. Keeping focus and openness independent avoids that. The
         trigger's real href (index.html#projects) is the fallback if this
         script doesn't run at all.
         This script must stay nested inside the header element (not placed
         after it), since sync_boilerplate.py's regex for this block stops
         at the first closing header tag it finds -- placed outside, a
         script here would be left behind as stale debris on the next
         resync instead of being replaced along with everything else.
         NOTE: do not spell out the literal opening/closing header markup
         in this comment -- doing so once fooled that same regex into
         matching too little and corrupting all pages using this partial. -->
    <script>
      document.querySelectorAll('.nav-item').forEach(function (item) {
        var trigger = item.querySelector('.dropdown-trigger');
        function setOpen(open) {
          item.classList.toggle('open', open);
          trigger.setAttribute('aria-expanded', open ? 'true' : 'false');
        }
        trigger.addEventListener('click', function (e) {
          e.preventDefault();
          setOpen(!item.classList.contains('open'));
        });
        item.addEventListener('keydown', function (e) {
          if (e.key === 'Escape' && item.classList.contains('open')) {
            setOpen(false);
            trigger.focus();
          }
        });
        item.addEventListener('focusout', function (e) {
          if (!item.contains(e.relatedTarget)) { setOpen(false); }
        });
        document.addEventListener('click', function (e) {
          if (!item.contains(e.target) && item.classList.contains('open')) { setOpen(false); }
        });
      });
    </script>
  </header>
